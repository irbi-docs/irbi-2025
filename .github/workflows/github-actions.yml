name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Action pihak ketiga dikunci ke commit SHA (bukan tag yang bisa dipindah) agar build
      # tidak diam-diam menjalankan kode lain. Sama dengan tag v2.2.0; perbarui SHA bila naik versi.
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.11.9
      - name: Render situs & PDF
        run: quarto render
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book
      - id: deployment
        uses: actions/deploy-pages@v5
